{% load static %}
{% block header %}
    <header id="page-topbar">
        <div class="layout-width">
            <div class="navbar-header">
                <div class="d-flex">
                    <!-- LOGO -->
                    <div class="navbar-brand-box horizontal-logo">
                        <a href=" " class="logo logo-dark">
                                <span class="logo-sm">
                                    <img src="{% static 'admin/images/logo-sm.pngd' %}" alt="" height="22">
                                </span>
                            <span class="logo-lg">
                                    <img src="{% static 'admin/images/logo-dark.pngd' %}" alt="" height="17">
                                </span>
                        </a>

                        <a href=" " class="logo logo-light">
                                <span class="logo-sm">
                                    <img src="{% static 'admin/images/logo-sm.pngd' %}" alt="" height="22">
                                </span>
                            <span class="logo-lg">
                                    <img src="{% static 'admin/images/logo-light.pngd' %}" alt="" height="17">
                                </span>
                        </a>
                    </div>

                    <button type="button" class="btn btn-sm px-3 fs-16 header-item vertical-menu-btn topnav-hamburger"
                            id="topnav-hamburger-icon">
                            <span class="hamburger-icon">
                                <span></span>
                                <span></span>
                                <span></span>
                            </span>
                    </button>

                </div>

                <div class="d-flex align-items-center">

                    <div class="ms-1 header-item d-none d-sm-flex">
                        <button type="button" class="btn btn-icon btn-topbar btn-ghost-secondary rounded-circle"
                                data-toggle="fullscreen">
                            <i class='bx bx-fullscreen fs-22'></i>
                        </button>
                    </div>

                    <div class="dropdown ms-sm-3 header-item topbar-user">
                        <button type="button" class="btn" id="page-header-user-dropdown" data-bs-toggle="dropdown"
                                aria-haspopup="true" aria-expanded="false">
                                <span class="d-flex align-items-center">
                                    <img class="rounded-circle header-profile-user"
                                         src="{% static 'admin/images/user-dummy-img.jpg' %}" alt="Header Avatar">
                                    <span class="text-start ms-xl-2">
                                        <span class="d-none d-xl-inline-block ms-1 fw-medium user-name-text">{{ request.user.username }}</span>
                                    </span>
                                </span>
                        </button>
                        <div class="dropdown-menu dropdown-menu-end">
                            <!-- item-->
                            <h6 class="dropdown-header">Bonjour {{ request.user }}!</h6>

                            {% if user.is_authenticated %}
                                {% if user.has_usable_password %}
                                    <a class="dropdown-item" href=" ">
                                        <i class="mdi mdi-key text-muted fs-16 align-middle me-1"></i>
                                        <span class="align-middle" data-key="t-change-password">Changer le mot de passe</span>
                                    </a>
                                {% else %}
                                    <a class="dropdown-item" href=" ">
                                        <i class="mdi mdi-key text-muted fs-16 align-middle me-1"></i>
                                        <span class="align-middle" data-key="t-set-password">Définir le mot de passe</span>
                                    </a>
                                {% endif %}
                                <a class="dropdown-item" href="">
                                    <i class="mdi mdi-logout text-muted fs-16 align-middle me-1"></i>
                                    <span class="align-middle" data-key="t-logout">Se Déconnecter</span>
                                </a>
                            {% endif %}
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </header>
{% endblock header %}
