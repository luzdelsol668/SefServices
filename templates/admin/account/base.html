{% load static %}
<!DOCTYPE html>
<html lang="en" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg">
<head>

    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">



    {% block seo %}

    {% endblock %}

    <link rel="shortcut icon" href="{% static 'admin/images/cetef/favicon.ico' %}">

    {% block css %}
        <!-- Layout config Js -->
        <script src="{% static 'admin/js/layout.js' %}"></script>
        <!-- Bootstrap Css -->
        <link href="{% static 'admin/css/mystyle.css' %}" id="bootstrap-style" rel="stylesheet" type="text/css"/>
        <link href="{% static 'admin/css/bootstrap.min.css' %}" id="bootstrap-style" rel="stylesheet" type="text/css"/>
        <!-- Icons Css -->
        <link href="{% static 'admin/css/icons.min.css' %}" rel="stylesheet" type="text/css"/>
        <!-- App Css-->
        <link href="{% static 'admin/css/app.min.css' %}" id="app-style" rel="stylesheet" type="text/css"/>
        <!-- custom Css-->
        <link href="{% static 'admin/css/custom.min.css' %}" id="app-style" rel="stylesheet" type="text/css"/>
    {% endblock css %}
</head>

<body>
<!-- auth-page wrapper -->
<div class="auth-page-wrapper auth-bg-cover py-5 d-flex justify-content-center align-items-center min-vh-100">
    <div class="bg-overlay"></div>
    <!-- auth-page content -->
    <div class="auth-page-content overflow-hidden pt-lg-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card overflow-hidden">
                        <div class="card-body">
                            {% block content %}

                            {% endblock content %}
                        </div>
                    </div>
                    <!-- end card -->
                </div>
                <!-- end col -->

            </div>
            <!-- end row -->
        </div>
        <!-- end container -->
    </div>
    <!-- end auth page content -->

    <!-- footer -->
    <footer class="footer">

        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="text-center">
                        <p class="mb-0">&copy;
                            <script>document.write(new Date().getFullYear())</script>
                            SEF Luxury Services <i class="mdi mdi-heart text-danger"></i> by Web Ascend
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </footer>
    <!-- end Footer -->
</div>

{% block javascript %}
    <!-- JAVASCRIPT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script src="{% static 'admin/libs/bootstrap/dist/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'admin/libs/simplebar/dist/simplebar.min.js' %}"></script>
    <script src="{% static 'admin/libs/node-waves/dist/waves.min.js' %}"></script>
    <script src="{% static 'admin/libs/feather-icons/dist/feather.min.js' %}"></script>
    <script src="{% static 'admin/js/pages/plugins/lord-icon-2.1.0.js' %}"></script>
    <script src="{% static 'admin/js/plugins.js' %}"></script>


    {% block extra_js %}
    {% endblock extra_js %}
{% endblock javascript %}
</body>

</html>
